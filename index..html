<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iPhone 16 Pro 交互模型</title>
<style>
:root{--bg:#e8e8ed;--fg:#1d1d1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111114;--fg:#eee}}
:root[data-theme="dark"]{--bg:#111114;--fg:#eee}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center}
#stage{width:440px;height:900px;flex:none;display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:421px;height:880px;padding:14px;border-radius:66px;background:linear-gradient(145deg,#fbfbf9,#d7d7d3 50%,#f5f5f2);box-shadow:inset 0 0 0 2px #c4c4bf,0 30px 60px rgba(0,0,0,.35)}
.btn{position:absolute;width:4px;background:linear-gradient(90deg,#bdbdb8,#eee);border-radius:2px}
#scr{position:relative;width:393px;height:852px;border-radius:52px;overflow:hidden;background:#000;color:#fff}
#scr.dk{color:#000}
.layer{position:absolute;inset:0}
#home{background:linear-gradient(165deg,#f7d9cc,#cdb8ee 45%,#86abf3);padding:70px 24px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 0;justify-items:center}
.ap{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-size:11px;cursor:pointer;text-shadow:0 1px 3px rgba(0,0,0,.25)}
.ap:active .ic{transform:scale(.92);filter:brightness(.8)}
.ic{width:60px;height:60px;border-radius:14px;overflow:hidden;transition:.15s}
.ic svg{width:100%;height:100%;display:block}
#dock{position:absolute;left:12px;right:12px;bottom:26px;height:96px;border-radius:36px;background:rgba(255,255,255,.28);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;justify-content:space-around;align-items:center}
#sb{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0 44px;font-weight:600;font-size:16px;z-index:50;pointer-events:none}
#sb i{display:inline-block;width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;position:relative;opacity:.9;margin-left:5px;vertical-align:-1px}
#sb i:after{content:"";position:absolute;inset:1.5px 5px 1.5px 1.5px;background:currentColor;border-radius:1.5px}
#isl{position:absolute;top:11px;left:50%;width:122px;height:35px;margin-left:-61px;background:#000;border-radius:20px;z-index:70;pointer-events:none}
#hi{position:absolute;bottom:0;left:0;right:0;height:30px;z-index:60;cursor:pointer;display:flex;justify-content:center;align-items:flex-end;padding-bottom:8px}
#hi b{width:136px;height:5px;border-radius:3px;background:#fff;opacity:.9}
#scr.dk #hi b{background:#000}
#app{background:#fff;color:#000;transform:scale(.1);opacity:0;pointer-events:none;transition:.28s cubic-bezier(.3,.8,.3,1);border-radius:52px;display:flex;flex-direction:column;padding-top:54px;z-index:20}
#app.show{transform:none;opacity:1;pointer-events:auto;border-radius:0}
.body{flex:1;overflow-y:auto;padding-bottom:34px}
.body::-webkit-scrollbar{display:none}
.nav{padding:8px 16px;display:flex;align-items:center;justify-content:space-between;min-height:44px;font-size:17px}
.nav .t{font-weight:600;font-size:17px}.nav a{color:#007aff;cursor:pointer}
h1{font-size:32px;padding:4px 16px 10px}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:.5px solid #e5e5ea;cursor:pointer}
.row:active{background:#eee}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(#a5aab5,#7d828d);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.sub{color:#8e8e93;font-size:13px}
.sp{margin-left:auto;text-align:right}
#lock{background:linear-gradient(165deg,#f7d9cc,#cdb8ee 45%,#86abf3);z-index:40;transition:transform .45s cubic-bezier(.5,0,.2,1)}
#lock.up{transform:translateY(-105%)}
#ld{position:absolute;top:96px;width:100%;text-align:center;font-size:20px;font-weight:500;opacity:.95}
#lc{position:absolute;top:116px;width:100%;text-align:center;font-size:92px;font-weight:300;letter-spacing:-2px;line-height:1.1}
.lbtn{position:absolute;bottom:58px;width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;font-size:20px}
#hint{position:absolute;bottom:42px;width:100%;text-align:center;font-size:12px;opacity:.0}
#pass{position:absolute;inset:0;background:rgba(40,40,60,.45);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);display:none;flex-direction:column;align-items:center;padding-top:110px;color:#fff;z-index:45}
#pass.on{display:flex;animation:fi .25s}
@keyframes fi{from{opacity:0}}
.dots{display:flex;gap:18px;margin:20px 0 36px}
.dots span{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff}
.dots span.f{background:#fff}
.dots.sh{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 20px}
.k{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;cursor:pointer;line-height:1}
.k small{font-size:10px;letter-spacing:2px;margin-top:2px;height:10px}
.k:active{background:rgba(255,255,255,.55)}
.k.t{background:none;font-size:16px}
.tg{width:51px;height:31px;border-radius:16px;background:#e5e5ea;position:relative;transition:.2s;flex:none;cursor:pointer}
.tg:after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:.2s}
.tg.on{background:#34c759}.tg.on:after{left:22px}
.bub{max-width:72%;padding:8px 12px;border-radius:18px;margin:4px 12px;font-size:16px;line-height:1.35;word-break:break-all}
.me{background:#007aff;color:#fff;margin-left:auto;border-bottom-right-radius:5px}
.ot{background:#e9e9eb;border-bottom-left-radius:5px}
.inp{display:flex;gap:8px;padding:8px 10px 34px;border-top:.5px solid #ddd;background:#f7f7f7}
.inp input{flex:1;border:1px solid #ccc;border-radius:18px;padding:8px 12px;font-size:16px;user-select:text;outline:0;background:#fff}
.inp button{border:0;background:#007aff;color:#fff;border-radius:18px;padding:0 14px;font-size:15px}
#call{position:absolute;inset:0;z-index:55;background:linear-gradient(#3a3d4a,#14151b);color:#fff;display:none;flex-direction:column;align-items:center;padding-top:130px}
#call.on{display:flex}
.cal{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;padding:0 10px;row-gap:6px}
.cal div{height:40px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer}
.cal .h{font-size:12px;color:#8e8e93;height:24px;cursor:default}
.cal .d span{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cal .td span{background:#ff3b30;color:#fff}.cal .sel span{background:#000;color:#fff}
.mini{position:absolute;left:10px;right:10px;bottom:36px;background:#fff;border-radius:14px;box-shadow:0 2px 14px rgba(0,0,0,.2);padding:8px 12px;display:flex;align-items:center;gap:10px}
.post{padding:12px 14px;border-bottom:8px solid #f2f2f2}
.acts{display:flex;justify-content:space-around;color:#777;font-size:14px;margin-top:10px}
.acts span{cursor:pointer}
.tabs{display:flex;justify-content:space-around;border-top:.5px solid #ddd;padding:6px 0 34px;font-size:11px;color:#888;background:#f7f7f7}

#sb{padding:6px 28px 0 46px}.sr{display:flex;align-items:center;gap:6px}
.bat{position:relative;width:27px;height:13px;border-radius:4px;background:currentColor;display:inline-flex;align-items:center;justify-content:center}
.bat b{font-size:10px;font-weight:700;color:#222;line-height:1}#scr.dk .bat b{color:#fff}
.bat:after{content:'';position:absolute;right:-3px;top:4px;width:2px;height:5px;background:currentColor;opacity:.45;border-radius:0 2px 2px 0}
#hi{height:36px}
.nav>a{min-width:84px;display:flex;align-items:center}.nav>a:last-child{justify-content:flex-end}
.bk{display:inline-flex;align-items:center;gap:5px;height:44px;padding:0 12px 0 6px;margin-left:-6px;cursor:pointer;font-size:17px}.bk:active{opacity:.4}
em.bd,.wtab em{position:absolute;min-width:18px;height:18px;border-radius:9px;background:#fa5151;color:#fff;font-size:12px;font-style:normal;line-height:18px;text-align:center;padding:0 5px}em.bd{top:-6px;right:-6px}
.wtab{display:flex;background:#f7f7f7;border-top:.5px solid #d9d9d9;padding:8px 0 30px}
.wtab>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#111;position:relative;cursor:pointer}
.wtab>div.on{color:#07c160}.wtab em{top:-5px;left:calc(50% + 4px)}
.wg{background:#fff;margin-bottom:8px;border-top:.5px solid #dcdcdc;border-bottom:.5px solid #dcdcdc}
.wr{display:flex;align-items:center;height:56px;padding-left:18px;cursor:pointer}.wr:active{background:#d9d9d9}
.wi{width:24px;height:24px;margin-right:15px;flex:none;display:flex;align-items:center;justify-content:center}
.wl{flex:1;height:56px;display:flex;align-items:center;justify-content:space-between;font-size:17px;border-bottom:.5px solid #e5e5e5;padding-right:22px}
.wl:after{content:'';width:8px;height:8px;border-right:2px solid #c7c7cc;border-top:2px solid #c7c7cc;transform:rotate(45deg);margin-right:3px}
.wg .wr:last-child .wl{border-bottom:0}
.wa{width:40px;height:40px;border-radius:5px;object-fit:cover;flex:none}
.pa{display:inline-block;width:22px;height:22px;border-radius:50%;border:1.5px solid #fff}
</style></head>

V.clock=function(){return '<div style="color:#fff;background:#000;flex:1;display:flex;flex-direction:column"><div class="nav"><a>'+bkb('主屏幕','closeApp()','#ff9f0a')+'</a><span></span><a style="color:#ff9f0a;font-size:26px" onclick="addAl()">＋</a></div><h1 style="color:#fff">闹钟</h1><div class="body">'+AL.map(function(a,i){return '<div class="row" style="border-color:#333;cursor:default;color:'+(a[2]?'#fff':'#777')+'" onclick="return false"><div><div style="font-size:48px;font-weight:300;line-height:1.1">'+a[0]+'</div><div class="sub">'+a[1]+'，每天</div></div><div class="sp"><div class="tg '+(a[2]?'on':'')+'" onclick="AL['+i+'][2]^=1;render()"></div></div></div>'}).join('')+'<div style="padding:14px 16px;display:flex;gap:10px;align-items:center"><input type="time" id="nt" value="09:00" style="user-select:text;background:#222;color:#fff;border:0;border-radius:8px;padding:8px;font-size:16px"><span class="sub">选择时间后点击右上角＋</span></div></div><div class="tabs" style="background:#1c1c1e;border-color:#333"><span>🌐<br>世界时钟</span><span style="color:#ff9f0a">⏰<br>闹钟</span><span>⏱<br>秒表</span><span>⏲<br>计时器</span></div></div>'};
function addAl(){var v=$('#nt').value||'09:00';AL.push([v,'闹钟',1]);AL.sort(function(a,b){return a[0]<b[0]?-1:1});render()}
/* 网易云 */
var SG=[['晴空','星河乐队','03:42'],['夜航船','林间','04:05'],['夏日未央','白鸽','03:18'],['远方的灯','山海','04:36'],['慢慢来','小满','03:55'],['风吹过','木心','03:29']],pl=-1,pp=0,ptm=null,ps=false;
V.music=function(){return '<div style="background:#fff;display:flex;flex-direction:column;flex:1;position:relative"><div class="nav">'+bkb('主屏幕','closeApp()','#d9001b')+'<span class="t" style="color:#d9001b">网易云音乐</span><span>🔍</span></div><div style="margin:6px 16px;height:110px;border-radius:14px;background:linear-gradient(120deg,#ff5a5f,#d9001b);color:#fff;padding:18px;font-size:22px;font-weight:600">每日推荐<div style="font-size:13px;font-weight:400;margin-top:6px">根据你的口味更新</div></div><div class="body" style="padding-bottom:140px">'+SG.map(function(s,i){return '<div class="row" onclick="play('+i+')"><div style="width:22px;color:'+(i==pl?'#d9001b':'#999')+'">'+(i==pl&&ps?'♫':i+1)+'</div><div><div style="color:'+(i==pl?'#d9001b':'#000')+'">'+s[0]+'</div><div class="sub">'+s[1]+'</div></div><div class="sp sub">'+s[2]+'</div></div>'}).join('')+'</div>'+(pl>=0?'<div class="mini"><div class="av" style="background:linear-gradient(#ff5a5f,#d9001b)">♪</div><div style="flex:1"><div style="font-size:14px">'+SG[pl][0]+' - '+SG[pl][1]+'</div><div style="height:3px;background:#eee;margin-top:6px;border-radius:2px"><div id="pb" style="height:3px;background:#d9001b;width:'+pp+'%;border-radius:2px"></div></div></div><span style="font-size:26px;cursor:pointer" onclick="tog()">'+(ps?'⏸':'▶️')+'</span></div>':'')+'</div>'};
function play(i){pl=i;pp=0;ps=true;run();render()}
function tog(){ps=!ps;run();render()}
function run(){clearInterval(ptm);if(ps)ptm=setInterval(function(){pp+=1;if(pp>=100){pp=0;pl=(pl+1)%SG.length;render()}var b=$('#pb');if(b)b.style.width=pp+'%'},700)}
/* 微博 */
var PS=[['新闻速递','刚刚','今晚多地将迎来降温，出门记得加衣～',[1203,86,412]],['美食日记','10分钟前','周末自制了一份红烧肉，肥而不腻，米饭杀手！',[560,43,98]],['旅行研究所','1小时前','秋天的杭州，随手一拍都是壁纸。',[2310,157,689]],['科技观察','2小时前','新一代手机影像再升级，夜景表现很亮眼。',[890,120,254]]],LK={};
V.weibo=function(){return '<div style="background:#fff"><div class="nav">'+bkb('主屏幕','closeApp()','#ff8200')+'<span class="t">首页</span><span>✉️</span></div><div style="display:flex;gap:22px;padding:4px 16px 8px;border-bottom:.5px solid #eee"><b style="color:#ff8200;border-bottom:3px solid #ff8200">关注</b><span>热门</span><span>同城</span></div></div><div class="body">'+PS.map(function(p,i){var l=LK[i]?1:0;return '<div class="post"><div style="display:flex;gap:10px;align-items:center"><div class="av" style="background:#ff8200">'+p[0][0]+'</div><div><div style="color:#ff6a00">'+p[0]+'</div><div class="sub">'+p[1]+' 来自 iPhone 16 Pro</div></div></div><div style="margin-top:10px;line-height:1.5">'+p[2]+'</div><div class="acts"><span>↗ '+p[3][1]+'</span><span>💬 '+p[3][2]+'</span><span style="color:'+(l?'#ff8200':'#777')+'" onclick="LK['+i+']=!LK['+i+'];render()">'+(l?'👍':'👍🏻')+' '+(p[3][0]+l)+'</span></div></div>'}).join('')+'</div>'};
</script>
</body></html>
